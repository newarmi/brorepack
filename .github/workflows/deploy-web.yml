# Mini App → GitHub Pages, бэкенд — Google Apps Script (apps/gas).
# Перед первым запуском: Settings → Pages → Source: GitHub Actions;
# Settings → Secrets and variables → Actions → Variables: GAS_URL (адрес …/exec), BOT_URL (https://t.me/<бот>).
name: Deploy Mini App

on:
  push:
    branches: [main]
    paths:
      - apps/web/**
      - packages/shared/**
      - pnpm-lock.yaml
      - .github/workflows/deploy-web.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check GAS_URL
        run: |
          if [ -z "${{ vars.GAS_URL }}" ]; then
            echo "::error::Задай переменную репозитория GAS_URL — адрес развёртывания Apps Script (…/exec)"
            exit 1
          fi

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile --filter "@brorepack/web..."

      - run: pnpm --filter @brorepack/web lint

      - run: pnpm --filter @brorepack/web test

      - run: pnpm --filter @brorepack/web build
        env:
          VITE_API_TRANSPORT: gas
          VITE_GAS_URL: ${{ vars.GAS_URL }}
          VITE_BOT_URL: ${{ vars.BOT_URL }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
